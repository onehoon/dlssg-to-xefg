name: PR Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64 DLL
        run: msbuild dlssg-to-xefg.sln -p:Configuration=Release -p:Platform=x64 -m

      - name: Build resource diagnostics tests
        run: msbuild tests\ResourceDiagnosticsTests.vcxproj -p:Configuration=Release -p:Platform=x64 -m

      - name: Run resource diagnostics tests
        run: bin\Tests\ResourceDiagnosticsTests.exe

      - name: Upload PR artifact
        uses: actions/upload-artifact@v4
        with:
          name: XeFG-NVNGX-PR-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            bin/Release/dlssg_to_xefg_intel_is_better.dll
            LICENSE
          if-no-files-found: error
